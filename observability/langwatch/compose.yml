name: herdr-fresh-langwatch
x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
x-app-env: &app-env
  SKIP_ENV_VALIDATION: "true"
  REDIS_URL: redis://redis:6379
  CLICKHOUSE_BACKUP_METRICS_ENABLED: "false"
  LANGWATCH_ENDPOINT: http://app:5560
  INSTALL_METHOD: docker
  NODE_ENV: production
  DISABLE_USAGE_STATS: "true"
  NODE_OPTIONS: --max-old-space-size=1536
services:
  app:
    logging: *bounded-logs
    image: ${LANGWATCH_IMAGE:-langwatch/langwatch:latest}
    env_file: private/server.env
    environment: *app-env
    ports: ["127.0.0.1:5560:5560"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
    volumes: ["app-data:/app/storage"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5560/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 180s
  workers:
    logging: *bounded-logs
    image: ${LANGWATCH_IMAGE:-langwatch/langwatch:latest}
    command: ["pnpm", "run", "start:workers"]
    working_dir: /app/platform/app
    env_file: private/server.env
    environment: *app-env
    depends_on:
      app: {condition: service_healthy}
    volumes: ["app-data:/app/storage"]
    restart: unless-stopped
  postgres:
    logging: *bounded-logs
    image: ${POSTGRES_IMAGE:-postgres:16}
    env_file: private/postgres.env
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prisma -d mydb"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    logging: *bounded-logs
    image: ${REDIS_IMAGE:-redis:alpine}
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  clickhouse:
    logging: *bounded-logs
    image: ${CLICKHOUSE_IMAGE:-langwatch/clickhouse-serverless:0.2.0}
    env_file: private/clickhouse.env
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    deploy:
      resources:
        limits: {memory: 2g, cpus: "1.0"}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
volumes:
  app-data:
  db-data:
  redis-data:
  clickhouse-data:
